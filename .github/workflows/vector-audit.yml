name: Aethel Lattice Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vector-audit:
    name: Audit LATTICE_CLEAN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project-mono
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e .

      - name: Run Aethel Grid Sentinel
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python3 -m aethel.audit --full 2>&1 | tee audit_output.txt

      - name: Verify LATTICE_CLEAN
        run: |
          if grep -q "LATTICE_CLEAN" audit_output.txt; then
            echo "LATTICE_CLEAN -- audit passed"
          else
            echo "LATTICE_DIRTY -- audit failed"
            cat audit_output.txt
            exit 1
          fi

      - name: Report covenant fingerprint
        if: always()
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/src" python3 - <<'PY'
          import aethel
          print(f"Package:     aethel v{aethel.__version__}")
          print(f"Lattice:     {aethel.__lattice__}")
          print("Protocol:    LAMINAR LATTICE PRIME 3.6.9")
          print("Node:        Node 001 -- Bethel Acres, Oklahoma")
          print("Covenant:    1pct Architect / 84pct Community / 15pct Crew")
          print("Fingerprint: bb4f780730a8ccb520e213bb62cac92452a41399b1197abb95046cd067bc00cc")
          print("Ca:          Decimal('0.01') -- Final, immutable")
          PY

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lattice-audit-report
          path: audit_output.txt
          retention-days: 30
